<div class="container about__grid">
  <div class="about__copy" appReveal>
    <p class="eyebrow">{{ i18n.t().about.eyebrow }}</p>
    <h2 class="section-title">
      {{ i18n.t().about.titleStart }}
      <span class="gradient-text">{{ i18n.t().about.titleHighlight }}</span>
    </h2>
    <p class="about__lede" [innerHTML]="i18n.t().about.ledeHtml"></p>
    <p [innerHTML]="i18n.t().about.paragraphHtml"></p>

    <ul class="about__facts">
      @for (fact of i18n.t().about.facts; track fact.label) {
        <li>
          <span class="about__fact-label">{{ fact.label }}</span>
          <span class="about__fact-value">{{ fact.value }}</span>
        </li>
      }
    </ul>
  </div>

  <div class="about__stats" [appReveal]="120">
    @for (stat of i18n.t().about.stats; track stat.label) {
      <div class="glass-panel glass-panel--interactive about__stat-card">
        <app-counter [value]="stat.value" [suffix]="stat.suffix" />
        <p>{{ stat.label }}</p>
      </div>
    }
  </div>
</div>
