<div class="container">
  <div class="contact__panel glass-panel glass-panel--interactive" appReveal>
    <div class="contact__copy">
      <p class="eyebrow">{{ i18n.t().contact.eyebrow }}</p>
      <h2 class="section-title">
        {{ i18n.t().contact.titleStart }}
        <span class="gradient-text">{{ i18n.t().contact.titleHighlight }}</span>
      </h2>
      <p>{{ i18n.t().contact.description }}</p>
      <a class="btn btn-primary" href="mailto:business.alpamis@gmail.com">
        <app-icon name="mail" />
        {{ i18n.t().contact.emailCta }}
      </a>
    </div>

    <div class="contact__socials">
      @for (link of links; track link.href) {
        <a [href]="link.href" [target]="link.href.startsWith('http') ? '_blank' : null" rel="noopener" [attr.aria-label]="link.label">
          <app-icon [name]="link.icon" />
        </a>
      }
    </div>
  </div>
</div>
