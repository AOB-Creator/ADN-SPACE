<div class="container">
  <div class="applications__head" appReveal>
    <p class="eyebrow">{{ i18n.t().applications.eyebrow }}</p>
    <h2 class="section-title">
      {{ i18n.t().applications.titleStart }}
      <span class="gradient-text">{{ i18n.t().applications.titleHighlight }}</span>
    </h2>
  </div>

  <div class="applications__grid">
    @for (app of i18n.t().applications.items; track app.title; let i = $index) {
      <article
        class="applications__card glass-panel glass-panel--interactive"
        [appReveal]="i * 80"
        [appTilt]="8"
      >
        <span class="applications__icon">{{ app.icon }}</span>
        <h3>{{ app.title }}</h3>
        <p>{{ app.description }}</p>
      </article>
    }
  </div>
</div>
